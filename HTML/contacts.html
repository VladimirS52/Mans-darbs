    <div class="contact-container">
        <h2>Kontakti</h2>
        <form>
            <label for="name">Vārds</label>
            <input type="text" id="name" placeholder="Enter your name" required>

            <label for="email">E-pasts</label>
            <input type="email" id="email" placeholder="Enter your email" required>

            <label for="message">Message</label>
            <textarea id="message" placeholder="Write your message here..." required></textarea>

            <button type="submit">Send Message</button>
        </form>

        <div class="contact-details">
            <h3>Informācija</h3>
            <p><strong>Kontakttālrunis:</strong> +1 234 567 890</p>
            <p><strong>E-pasts:</strong> <a href="mailto:info@cargo.com">info@cargo.com</a></p>
            <p><strong>Adrese:</strong> 123 Car Rental Street, Cityville, Country</p>
        </div>

        <div class="map-container">
            <h3>Atrodiet mūs šeit</h3>
            <iframe src="https://www.google.com/maps/embed?pb=!1m14!1m12!1m3!1d139476.5656590638!2d24.105761921582015!3d56.891878768801256!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!5e0!3m2!1sen!2slv!4v1736900555748!5m2!1sen!2slv" width="600" height="450" style="border:0;" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
        </div>
    </div>
